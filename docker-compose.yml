name: n8n-rag

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector. init.sql runs automatically on first boot.
  # --------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --------------------------------------------------------------------------
  # Ollama: local embeddings (bge-m3, 1024-d) + local LLM (llama3.2).
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      # bge-m3 + llama3.2:1b together need ~2.5 GB; lower to "1" on very small machines.
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 30

  # One-shot job: downloads the models into the ollama volume, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: rag-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull bge-m3 && ollama pull llama3.2:1b"]
    restart: "no"

  # --------------------------------------------------------------------------
  # n8n. On the very first boot, bootstrap.sh imports the Postgres credential
  # and both workflows so nothing has to be wired up by hand.
  # --------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: rag-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-dev-encryption-key-change-me}
      N8N_SECURE_COOKIE: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /data
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Consumed by bootstrap.sh to create the n8n Postgres credential.
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    entrypoint: ["/bin/sh", "/seed/bootstrap.sh"]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data:ro
      - ./workflows:/seed/workflows:ro
      - ./scripts/bootstrap.sh:/seed/bootstrap.sh:ro

volumes:
  pgdata:
  ollama:
  n8n_data:
